name: Build APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git zlib1g-dev libssl-dev libncurses5-dev libsqlite3-dev libgdbm-dev libdb5.3-dev libpcap-dev liblzma-dev libffi-dev lshw gperf openjdk-17-jdk unzip autoconf
          pip install --upgrade pip
          pip install buildozer cython kivy

      - name: Build APK
        run: |
          yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raspidor-apk
          path: bin/*.apk
